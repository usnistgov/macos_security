id: os_safari_private_browsing_disable
title: Ensure Private Browsing in Safari Is Disabled
discussion: |
  Private browsing _MUST_ be disabled in Safari.
references:
  nist:
    cce:
      macos_27:
        - CCE-97070-7
      macos_26:
        - CCE-95599-7
      ios_26:
        - CCE-96736-4
      ios_27:
        - CCE-97374-3
      visionos_27:
        - CCE-97463-4
  bsi:
    indigo:
      ios_26:
        - ANNEX K
platforms:
  macOS:
    '27.0': {}
    '26.0': {}
    enforcement_info:
      check:
        shell: |-
          /usr/bin/osascript -l JavaScript -e 'var s = $.NSUserDefaults.alloc.initWithSuiteName("com.apple.applicationaccess"); (ObjC.unwrap(s.objectForKey("allowSafariPrivateBrowsing")) == false && s.objectIsForcedForKey("allowSafariPrivateBrowsing")) ? "PASS" : "FAIL"'
        result:
          string: 'PASS'
    introduced: '26.0'
  iOS:
    '27.0':
      supervised: true
    '26.0':
      supervised: true
      benchmarks:
        - name: indigo_base
          severity: high
        - name: indigo_high
          severity: high
    introduced: '26.0'
  visionOS:
    '27.0':
      supervised: true
    introduced: '26.0'
tags:
  - none
mobileconfig_info:
  - PayloadType: com.apple.applicationaccess
    PayloadContent:
      - allowSafariPrivateBrowsing: false
