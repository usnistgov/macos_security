id: os_natural_language_editing_disable
title: Disable Apple Intelligence Natural Language Editing in Calendar and Reminders
discussion: |
  Apple Intelligence Features such as Natural Language Editing that use off device AI _MUST_ be disabled.

  Apple Intelligence sends data to off device infrastructure, Private Cloud Compute (PCC), that is not directly controlled by the organization. Therefore, Apple Intelligence features that rely on off device processing _MUST_ be disabled unless explicitly approved by the organization.

  This requirement helps ensure that organizational data is managed in accordance with established security, privacy, access-control, and data governance requirements.

  [NOTE]
  ====
  The reviewer MUST manually verify that the Declarative Device Management (DDM) configuration has been applied to the system.

  To verify the declaration: Open System Settings, click on General. Scroll down and click on Device Management. Double click on the MDM enrollment profile to examine it. Scroll down to Device Declarations within that window and verify the setting has been applied.
  ====
  [NOTE]
  ====
  Disabling Siri or Siri AI also disables the use of Natural Language Editing and other Apple Intelligence features that use Siri or Siri AI.
  ====
