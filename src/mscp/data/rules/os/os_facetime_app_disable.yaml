id: os_facetime_app_disable
title: Disable FaceTime.app
discussion: |
  The macOS built-in FaceTime.app _MUST_ be disabled, unless FaceTime is an approved collaboration tool.

  The FaceTime.app establishes a connection to Apple's iCloud service, even when security controls have been put in place to disable iCloud access.

  [IMPORTANT]
  ====
  Preventing the launch of any application using the DeniedBinaries key will also prevent the launching of ad-hoc signed binaries and unsigned binaries.
  ====

  [NOTE]
  =====
  Apple officially supports installation through DDM of this configuration, however installation using a mobileconfig profile with the domain of com.apple.alr will also block the launching of binaries.
  =====
references:
  nist:
    cce:
      macos_27:
        - CCE-97021-0
    800-53r5:
      - AC-20
      - CM-7
      - CM-7(1)
    800-171r3:
      - 03.01.20
      - 03.04.06
  disa:
    cci:
      - CCI-000381
    srg:
      - SRG-OS-000095-GPOS-00049
    disa_stig:
      macos_27:
        - APPL-27-002010
    cmmc:
      - AC.L1-3.1.20
      - CM.L2-3.4.6
      - CM.L2-3.4.7
  hhs:
    hicp:
      - 2.L.A
  cis:
    controls_v8:
      - 4.1
      - 4.8
platforms:
  macOS:
    '27.0':
      benchmarks:
        - name: disa_stig
          severity: medium
    enforcement_info:
      check:
        shell: |-
          /usr/bin/osascript -l JavaScript -e 'var s = $.NSUserDefaults.alloc.initWithSuiteName("com.apple.alr"); var list = ObjC.unwrap(s.objectForKey("DenyList")) || []; (list.some(function(item) { return ObjC.unwrap(item.objectForKey("SigningID")) == "com.apple.FaceTime"; }) && s.objectIsForcedForKey("DenyList")) ? "PASS" : "FAIL"'
        result:
          string: 'PASS'
    introduced: '27.0'
tags:
  - cnssi-1253_low
  - cnssi-1253_high
  - cnssi-1253_moderate
  - hicp_lp
mobileconfig_info:
  - PayloadType: com.apple.alr
    PayloadContent:
      - DenyList:
          - SigningID:
              - com.apple.FaceTime
ddm_info:
  declarationtype: com.apple.configuration.app.settings
  ddm_key: Allowed
  ddm_value: {'DeniedBinaries': ["SigningID": "com.apple.FaceTime"]}
