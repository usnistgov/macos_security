    '27.0': {}
    '26.0': {}
    enforcement_info:
      check:
        shell: |-
          /usr/bin/osascript -l JavaScript << EOS
          $.NSUserDefaults.alloc.initWithSuiteName('com.apple.Safari')\
          .objectForKey('allowJavaScript').js
          EOS
        result:
          string: 'false'
    introduced: '-1'
