id: os_asl_log_files_permissions_configure
title: Configure Apple System Log Files To Mode 640 or Less Permissive
discussion: |
  The Apple System Logs (ASL) _MUST_ be configured to be writable by root and readable only by the root user and group wheel. To achieve this, ASL log files _MUST_ be configured to mode 640 permissive or less; thereby preventing normal users from reading, modifying or deleting audit logs. System logs frequently contain sensitive information that could be used by an attacker. Setting the correct permissions mitigates this risk.
references:
  nist:
    cce:
      macos_27:
        - CCE-97005-3
      macos_26:
        - CCE-95162-4
      macos_15:
        - CCE-94162-5
      macos_14:
        - CCE-92762-4
    800-53r5:
      - SI-11
  disa:
    cci:
      - CCI-001312
      - CCI-001314
    srg:
      - SRG-OS-000206-GPOS-00084
      - SRG-OS-000205-GPOS-00083
    disa_stig:
      macos_27:
        - APPL-27-004002
      macos_26:
        - APPL-26-004002
      macos_15:
        - APPL-15-004002
      macos_14:
        - APPL-14-004002
platforms:
  macOS:
    '27.0':
      benchmarks:
        - name: disa_stig
          severity: medium
    '26.0':
      benchmarks:
        - name: disa_stig
          severity: medium
    '15.0':
      benchmarks:
        - name: disa_stig
          severity: medium
    enforcement_info:
      check:
        shell: /usr/bin/awk 'FNR==1{b=(FILENAME=="/etc/asl.conf")?"/var/log/":"/var/log/module/" substr(FILENAME,10) "/"} $1==">"{print (($2 ~ /^\//)?$2:b $2)}' /etc/asl.conf /etc/asl/* 2>/dev/null | /usr/bin/sort -u | while IFS= read -r p; do [ -f "$p" ] && [ ! -L "$p" ] && /usr/bin/find "$p" ! -perm 640 -print; done | /usr/bin/wc -l | /usr/bin/tr -d ' '
        result:
          integer: 0
      fix:
        shell: /usr/bin/awk 'FNR==1{b=(FILENAME=="/etc/asl.conf")?"/var/log/":"/var/log/module/" substr(FILENAME,10) "/"} $1==">"{print (($2 ~ /^\//)?$2:b $2)}' /etc/asl.conf /etc/asl/* 2>/dev/null | /usr/bin/sort -u | while IFS= read -r p; do [ -f "$p" ] && [ ! -L "$p" ] && /bin/chmod 640 "$p"; done
tags:
  - 800-53r5_moderate
  - 800-53r5_high
  - cnssi-1253_low
  - cnssi-1253_high
  - cnssi-1253_moderate
