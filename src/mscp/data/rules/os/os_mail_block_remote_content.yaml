id: os_mail_block_remote_content
title: Block Remote Content
discussion: |
  The user _MUST_ manually block remote content in Apple Mail.

  To disable, open the Settings app. Tap on Mail. Scroll down to the Messages section and tap Privacy Protection. Toggle off the Protect Mail Activity switch, then toggle On the Block All Remote Content switch.
