platforms:
  macOS:
    '27.0':
      benchmarks:
        - name: cis_lvl2
    '26.0':
      benchmarks:
        - name: cis_lvl2
    '15.0': {}
    enforcement_info:
      check:
        shell: |-
          /usr/bin/osascript -l JavaScript -e 'var s = $.NSUserDefaults.alloc.initWithSuiteName("com.apple.applicationaccess"); (ObjC.unwrap(s.objectForKey("allowUIConfigurationProfileInstallation")) == false && s.objectIsForcedForKey("allowUIConfigurationProfileInstallation")) ? "PASS" : "FAIL"'
        result:
          string: 'PASS'
    introduced: '13.0'
  iOS:
    '27.0':
      supervised: true
    '26.0':
      supervised: true
      benchmarks:
        - name: cis_lvl1_enterprise
