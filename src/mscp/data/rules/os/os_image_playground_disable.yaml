id: os_image_playground_disable
title: Disable Apple Intelligence Image Playground
discussion: Apple Intelligence features such as Image Playground _MUST_ be disabled due to the fact they use off device AI.
references:
  nist:
    cce:
      macos_27:
        - CCE-XXXXX-X
      macos_26:
        - CCE-95207-7
      macos_15:
        - CCE-94208-6
      ios_27:
        - CCE-XXXXX-X        
      ios_26:
        - CCE-95482-6
      ios_18:
        - CCE-94536-0
      visionos_27:
        - CCE-XXXXX-X
      visionos_26:
        - CCE-95579-9
    800-53r5:
      - AC-20
      - AC-20(1)
      - CM-7
      - CM-7(1)
      - SC-7(10)
    800-171r3:
      - 03.01.20    
      - 03.04.06
  disa:
    cci:
      - CCI-000381
      - CCI-001774
    srg:
      - SRG-OS-000095-GPOS-00049
    disa_stig:
      macos_26:
        - APPL-26-005150
      macos_15:
        - APPL-15-005150        
      ios_26:
        - AIOS-26-017300
      ios_18:
        - AIOS-18-017300
      visionos_26:
        - AVOS-26-017300
    cmmc:
      - AC.L1-3.1.20    
      - CM.L2-3.4.6
      - CM.L2-3.4.7
  hhs:
    hicp:
      - 2.L.A
platforms:
  macOS:
    '27.0': {}
    '26.0':
      benchmarks:
        - name: disa_stig
    '15.0':
      benchmarks:
        - name: disa_stig        
    enforcement_info:
      check:
        shell: |-
          /usr/bin/osascript -l JavaScript -e 'var s = $.NSUserDefaults.alloc.initWithSuiteName("com.apple.applicationaccess"); (ObjC.unwrap(s.objectForKey("allowImagePlayground")) == false && s.objectIsForcedForKey("allowImagePlayground")) ? "PASS" : "FAIL"'
        result:
          string: 'PASS'
    introduced: '15.0'
  iOS:
    '27.0':
      supervised: true
    '26.0':
      supervised: true
      benchmarks:
        - name: ios_stig
    '18.0':
      supervised: true
      benchmarks:
        - name: ios_stig
    introduced: '18.0'
  visionOS:
    '27.0':
      supervised: true
    '26.0':
      supervised: true
      benchmarks:
        - name: visionos_stig
          severity: low
    introduced: '2.4'
tags:
  - 800-53r5_low
  - 800-53r5_moderate
  - 800-53r5_high
  - cnssi-1253_low
  - cnssi-1253_high
  - 800-171
  - cmmc_lvl2
  - cmmc_lvl1
  - cnssi-1253_moderate
  - hicp_lp
  - cmmc_lvl3
mobileconfig_info:
  - PayloadType: com.apple.applicationaccess
    PayloadContent:
      - allowImagePlayground: false
ddm_info:
  declarationtype: com.apple.configuration.intelligence.settings
  ddm_key: AllowImagePlayground
  ddm_value: false
