---
id: os_crypto_audit
title: Protect Audit Integrity with Cryptographic Mechanisms
discussion: |-
  The information system _IS_ configured to implement cryptographic mechanisms to protect the integrity of audit information and audit tools.

  The Apple Secure Enclave includes a dedicated Advanced Encryption Standard (AES) crypto engine built into the direct memory access (DMA) path between the flash storage and main system memory, which powers line-speed encrypted storage with FileVault and makes internal volume highly efficient.

  link:https://support.apple.com/guide/security/the-secure-enclave-sec59b0b31ff/web[]

  NOTE: This will only apply to a Mac that includes a Secure Enclave security chip.

  NOTE: The technology supports this requirement and cannot be configured to be out of compliance. The technology inherently meets this requirement.
