id: os_messages_summary_disable
title: Disable Apple Intelligence Summarize Messages
discussion: Apple Intelligence features such as Apple Messages Summary that use off device AI _MUST_ be disabled. Apple will not give a guarantee that the Apple Intelligence feature will stay on device, so it _MUST_ be disabled.
references:
  nist:
    cce:
      macos_27:
        - CCE-97270-3
    800-53r5:
      - AC-20
      - AC-20(1)
      - CM-7
      - CM-7(1)
      - SC-7(10)
    800-171r3:
      - 03.01.20
      - 03.04.06
  disa:
    cmmc:
      - AC.L1-3.1.20
      - CM.L2-3.4.6
      - CM.L2-3.4.7
  hhs:
    hicp:
      - 1.L.B
      - 2.L.A
      - 4.L.A
      - 4.L.B
platforms:
  macOS:
    '27.0': {}
    enforcement_info:
      check:
        shell: |-
          /usr/bin/osascript -l JavaScript << EOS
          $.NSUserDefaults.alloc.initWithSuiteName('com.apple.MobileSMS')\
          .objectForKey('messageSummarizationEnabled').js
          EOS
        result:
          string: 'false'
tags:
  - 800-53r5_low
  - 800-53r5_moderate
  - 800-53r5_high
  - 800-171
  - cmmc_lvl2
  - cmmc_lvl1
  - cnssi-1253_moderate
  - cnssi-1253_low
  - cnssi-1253_high
  - hicp_lp
mobileconfig_info:
  - PayloadType: com.apple.MobileSMS
    PayloadContent:
      - messageSummarizationEnabled: false
