        shell: |-
          /usr/bin/osascript -l JavaScript -e 'var s = $.NSUserDefaults.alloc.initWithSuiteName("com.apple.ironwood.support"); (ObjC.unwrap(s.objectForKey("Ironwood Allowed")) == false && s.objectIsForcedForKey("Ironwood Allowed")) ? "PASS" : "FAIL"'
