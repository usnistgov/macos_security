          severity: medium
    '15.0':
      benchmarks:
        - name: disa_stig
          severity: medium
      enforcement_info:
        check:
          shell: |-
            /usr/bin/osascript -l JavaScript -e 'var s = $.NSUserDefaults.alloc.initWithSuiteName("com.apple.applicationaccess"); (ObjC.unwrap(s.objectForKey("allowDictation")) == false && s.objectIsForcedForKey("allowDictation")) ? "PASS" : "FAIL"'
          result:
