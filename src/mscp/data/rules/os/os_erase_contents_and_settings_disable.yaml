platforms:
  macOS:
    '27.0': {}
    '26.0':
      benchmarks:
        - name: disa_stig
          severity: medium
    '15.0':
      benchmarks:
        - name: disa_stig
          severity: medium
    enforcement_info:
      check:
        shell: |-
          /usr/bin/osascript -l JavaScript << EOS
          $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
          .objectForKey('allowEraseContentAndSettings').js
          EOS
        result:
          string: 'false'
    introduced: '12.0'
  iOS:
    '27.0': {}
    '26.0':
      supervised: true
      benchmarks:
        - name: cis_lvl1_enterprise
        - name: cis_lvl2_enterprise
        - name: ios_stig
    '18.0':
      supervised: true
      benchmarks:
        - name: cis_lvl1_enterprise
        - name: cis_lvl2_enterprise
        - name: ios_stig
    '17.0':
      supervised: true
      benchmarks:
        - name: cis_lvl1_enterprise
        - name: cis_lvl2_enterprise
    introduced: '8.0'
  visionOS:
    '27.0': {}
