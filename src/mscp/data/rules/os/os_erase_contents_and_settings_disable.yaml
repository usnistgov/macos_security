  nist:
    cce:
      macos_27:
        - CCE-XXXXX-X
      macos_26:
        - CCE-95185-5
      macos_15:
        - CCE-94185-6
      macos_14:
        - CCE-92785-5   
      ios_27:
        - CCE-XXXXX-X   
      ios_26:
        - CCE-95460-2
      ios_18:
        - CCE-94437-1
      ios_17:
        - CCE-93422-4
      visionos_27:
        - CCE-XXXXX-X
      visionos_26:
        - CCE-95572-4
    800-53r5:
      - CM-6
      - CM-7
      - CM-7(1)
    800-171r3:
      - 03.04.06      
  disa:
    cci:
      - CCI-000366
      - CCI-000381
    srg:
      - SRG-OS-000480-GPOS-00227
      - SRG-OS-000095-GPOS-00049      
