id: os_allow_prerelease_disable
title: Disable the Ability to Install PreRelease Software
discussion: |
  Beta software may contain features that could lead to the compromise of sensitive information or provide a vector for the attack on a network.
references:
  nist:
    cce:
      macos_27:
        - CCE-97263-8
      macos_26:
        - CCE-96739-8
      ios_27:
        - CCE-97268-7
      ios_26:
        - CCE-96740-6
      visionos_26:
        - CCE-96711-7
    800-53r5:
      - CM-6
      - CM-7
  disa:
    cci:
      - CCI-000366
    disa_stig:
      ios_27:
        - AIOS-27-013900
      visionos_26:
        - AVOS-26-015500
    sfr:
      - 'FMT_MOF_EXT.1.2 #47'
platforms:
  'macOS':
    '27.0': {}
    '26.0': {}
    enforcement_info:
      check:
        shell: |-
          configprofile=$(/usr/bin/osascript -l JavaScript << EOS
          $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate')\
          .objectForKey('AllowPreReleaseInstallation').js
          EOS
          )
          ddm=$(/usr/bin/plutil -convert json /var/db/softwareupdate/SoftwareUpdateDDMStatePersistence.plist -o - | /usr/bin/jq --raw-output .'SUCorePersistedStatePolicyFields.SUCoreDDMDeclarationGlobalSettings.programEnrollment')
          if [[ "$configprofile" == "false" ]] || [[ "$ddm" == "0" ]]; then
            echo "true"
          else
            echo "false"
          fi
        result:
          string: 'true'
        fix:
          additional_info: This is implemented by Declarative Device Management (DDM) or by configuration profile.
  iOS:
    '27.0':
      supervised: true
      benchmarks:
        - name: ios_stig
          severity: medium
    '26.0':
      supervised: true
    introduced: '-1'
  visionOS:
    '26.0':
      benchmarks:
        - name: visionos_stig
          severity: medium
      supervised: true
    introduced: '-1'
tags:
  - 800-53r5_low
  - 800-53r5_moderate
  - 800-53r5_high
  - cnssi-1253_moderate
  - cnssi-1253_low
  - cnssi-1253_high
mobileconfig_info:
  - PayloadType: com.apple.softwareupdate
    PayloadContent:
      - AllowPreReleaseInstallation: false
ddm_info:
  declarationtype: com.apple.configuration.softwareupdate.settings
  ddm_key: Beta
  ddm_value:
    ProgramEnrollment: AlwaysOff
