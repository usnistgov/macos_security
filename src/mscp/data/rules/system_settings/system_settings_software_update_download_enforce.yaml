id: system_settings_software_update_download_enforce
title: Enforce Software Update Downloads Updates Automatically
discussion: |
  Software Update _MUST_ be configured to enforce automatic downloads of updates is enabled.
references:
  nist:
    cce:
      macos_27:
        - CCE-97176-2
      macos_26:
        - CCE-95403-2
      macos_15:
        - CCE-94396-9
      macos_14:
        - CCE-92991-9
      ios_27:
        - CCE-97416-2
      ios_26:
        - CCE-96730-7
  cis:
    benchmark:
      macos_26:
        - 1.2 (level 1)
      macos_15:
        - 1.3 (level 1)
      macos_14:
        - 1.3 (level 1)
      macos_27:
        - 1.2 (level 1)
    controls_v8:
      - 7.3
      - 7.4
  bzk:
    bio:
      - 8.08.01
      - 8.08
platforms:
  macOS:
    '27.0':
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2
    '26.0':
      enforcement_info:
        check:
          shell: |-
            configprofile=$(/usr/bin/osascript -l JavaScript << EOS
            $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate')\
            .objectForKey('AutomaticDownload').js
            EOS
            )
            ddm=$(/usr/bin/plutil -convert json /var/db/softwareupdate/SoftwareUpdateDDMStatePersistence.plist -o - | /usr/bin/jq --raw-output .'SUCorePersistedStatePolicyFields.SUCoreDDMDeclarationGlobalSettings.automaticallyDownload')
            if [[ "$configprofile" == "true" ]] || [[ "$ddm" == "1" ]]; then
              echo "true"
            else
              echo "false"
            fi
          result:
            string: 'true'
          fix:
            additional_info: This is implemented by Declarative Device Management (DDM) or by configuration profile.
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2
        - name: nlmapgov_plus
        - name: nlmapgov_base
    '15.0':
      enforcement_info:
        check:
          shell: |-
            /usr/bin/osascript -l JavaScript << EOS
            $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdate')\
            .objectForKey('AutomaticDownload').js
            EOS
          result:
            string: 'true'
      benchmarks:
        - name: cis_lvl1
        - name: cis_lvl2
        - name: nlmapgov_plus
        - name: nlmapgov_base
    enforcement_info:
      check:
        shell: /usr/bin/plutil -convert json /var/db/softwareupdate/SoftwareUpdateDDMStatePersistence.plist -o - | /usr/bin/jq --raw-output .'SUCorePersistedStatePolicyFields.SUCoreDDMDeclarationGlobalSettings.automaticallyDownload'
        result:
          integer: 1
      fix:
        additional_info: This is implemented by Declarative Device Management (DDM).
        result:
          string: 'true'
    introduced: '10.15'
  iOS:
    '27.0':
      supervised: true
    '26.0':
      supervised: true
      benchmarks:
        - name: nlmapgov_base
        - name: nlmapgov_plus
tags:
  - cisv8
mobileconfig_info:
  - PayloadType: com.apple.SoftwareUpdate
    PayloadContent:
      - AutomaticDownload: true
ddm_info:
  declarationtype: com.apple.configuration.softwareupdate.settings
  ddm_key: AutomaticActions
  ddm_value:
    Download: AlwaysOn
