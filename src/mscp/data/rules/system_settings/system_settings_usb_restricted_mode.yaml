          severity: medium
    enforcement_info:
      check:
        shell: |-
          /usr/bin/osascript -l JavaScript << EOS
            function run() {
              let pref1 = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\
            .objectForKey('allowUSBRestrictedMode'))
              if ( pref1 == false ) {
                let forced = ObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName("com.apple.ironwood.support").objectIsForcedForKey("allowUSBRestrictedMode"))
                if ( forced == true ) {
                  return("FAIL")
                } else {
                  return("PASS")
                }
              } else {
                return("PASS")
              }
            }
          EOS
        result:
          string: 'PASS'
