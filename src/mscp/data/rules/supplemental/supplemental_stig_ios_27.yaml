---
id: supplemental_stig_ios_27
title: DISA STIG Supplemental for iOS/iPadOS 27
discussion: |
  These are controls that require additional considerations for your environment.

  [cols="20%h, 80%a"]
  |===
  |STIG ID
  |Rule Title

  |AIOS-27-000400| Apple iOS/iPadOS 27 must allow the administrator (MDM) and/or the user to perform the following management function: enable/disable VPN protection across the device and [selection: other methods].
  |AIOS-27-006800| Apple iOS/iPadOS 27 allowlist must be configured to not include applications with the following characteristics: Backs up MD data to non-DoW cloud servers (including user and application access to cloud backup services); Transmits MD diagnostic data to non-DoW servers; Allows synchronization of data or applications between devices associated with user; Allows unencrypted (or encrypted but not FIPS 140-3-validated) data sharing with other MDs or printers; and Backs up own data to a remote system.
  |AIOS-27-006800| Apple iOS/iPadOS 27 must be configured to disable App Clips. Install a configuration profile to block app clips of prohibited apps (Configuration Key: allowAppClips)
  |AIOS-27-008100| Apple iOS/iPadOS 27 must be configured to display the DoW advisory warning message at startup or each time the user unlocks the device.
  |AIOS-27-008400| Apple iOS/iPadOS 27 must be configured to not allow backup of [all applications, configuration data] to locally connected systems.
  |AIOS-27-008900| Apple iPadOS 27 must be configured to disable multiuser modes.
  |AIOS-27-009000| Apple iOS/iPadOS 27 must be configured to [selection: wipe protected data, wipe sensitive data] upon unenrollment from device management service.
  |AIOS-27-009100| Apple iOS/iPadOS 27 must be configured to [selection: remove Enterprise applications, remove all noncore applications (any nonfactory installed application)] upon unenrollment from device management service.
  |AIOS-27-010400| iPhone and iPad must have the latest available iOS/iPadOS operating system installed.
  |AIOS-27-010800| Apple iOS/iPadOS 27 must implement the management setting: not have any Family Members in Family Sharing.
  |AIOS-27-010900| Apple iOS/iPadOS 27 must implement the management setting: not share location data through iCloud.
  |AIOS-27-011100| Apple iOS/iPadOS 27 users must complete required training.
  |AIOS-27-011200| A managed photo app must be used to take and store work-related photos.
  |AIOS-27-012500| The Apple iOS/iPadOS 27 must be supervised by the MDM.
  |AIOS-27-012800| Apple iOS must implement the management setting: not allow a user to remove Apple iOS configuration profiles that enforce DoW security requirements.
  |AIOS-27-013300| Apple iOS/iPadOS 27 must have DoW root and intermediate PKI certificates installed.
  |AIOS-27-013900| Apple iOS/iPadOS 27 must disable the download of iOS/iPadOS beta updates.
  |AIOS-27-015800| DoW Apple iOS/iPadOS 27 devices must have a Mobile Threat Detection (MTD) app installed.
  |AIOS-27-016400| Apple iOS/iPadOS 27 must be configured to disable Wi-Fi Aware.
  |AIOS-27-016500| The Apple iOS/iPadOS 27 device must be configured to disable web-based artificial intelligence (AI) interactions.
  |===

  These are controls that will not be configurable if the following are applied.

  - `AIOS-27-014900` Apple iOS/iPadOS 27 must disable AirPrint.

  [cols="20%h, 80%a"]
  |===
  |STIG ID
  |Rule Title

  |AIOS-27-015000| Apple iOS/iPadOS 27 must disable AirPrint: Allow discovery of AirPrint printers using iBeacons.
  |AIOS-27-015100| Apple iOS/iPadOS 27 must disable AirPrint: Allow storage of AirPrint credentials in Keychain.
  |AIOS-27-015200| Apple iOS/iPadOS 27 must allow AirPrint feature: Disallow AirPrint to destinations with untrusted certificates.
  |===
